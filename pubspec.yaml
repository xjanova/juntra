name: juntra
description: "จันทราพยากรณ์ — แอพดูดวงทาโรต์ AI โดยแม่หมอจันทรา · POWERED BY XMAN STUDIO"
publish_to: 'none'

# Single source of truth for app version. Bumped automatically by
# .github/workflows/auto-bump-on-merge.yml on PR merge, then the release
# workflow tags + builds APK + signs + publishes Release artifacts.
version: 0.3.5+16

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management — proven Riverpod 2.x setup, matches thaipromptapp
  flutter_riverpod: ^2.6.1

  # Routing — declarative, supports deep links to specific screens later
  go_router: ^14.6.2

  # HTTP — Dio with retry + pretty logger for dev
  dio: ^5.7.0
  dio_smart_retry: ^7.0.1
  pretty_dio_logger: ^1.4.0

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5

  # UI atoms — gold/purple cinematic look
  google_fonts: ^6.2.1                 # Bai Jamjuree, Noto Sans Thai, Noto Serif Thai, Cinzel
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.2              # Concise animation chains for screen entries
  shimmer: ^3.0.0                      # Skeleton loading on home/list
  flutter_svg: ^2.0.16                 # Natal chart wheel + crescent moon glyphs
  flutter_markdown: ^0.7.5             # Render update changelog markdown

  # Device + system
  device_info_plus: ^11.2.0
  package_info_plus: ^8.1.1
  permission_handler: ^11.3.1
  connectivity_plus: ^6.1.0

  # Auto-update internals (Android sideload).
  # NOTE: We use GitHub Releases as artifact storage but expose ZERO github
  # URLs in the UI — everything user-facing says "เซิร์ฟเวอร์อัปเดต".
  open_filex: ^4.5.0
  url_launcher: ^6.3.1

  # QR (PromptPay payment + future affiliate referral QR)
  qr_flutter: ^4.1.0

  # Slip image picker — camera + gallery for native PromptPay top-up
  # slip uploads. Pinned to 1.x so the Android EmbedderV2 quirks of 2.x
  # don't bite. Has platform pickers; no separate iOS plugin needed.
  image_picker: ^1.1.2

  # Sensory polish — haptics on card tap + bell on reveal
  vibration: ^2.0.0
  audioplayers: ^6.1.0

  # Utilities
  collection: ^1.19.0
  intl: ^0.20.1
  logger: ^2.5.0
  equatable: ^2.0.7
  uuid: ^4.5.1
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  # อ่าน pubspec.yaml ใน test/juntra_art_test.dart เพื่อยืนยันว่าโฟลเดอร์ภาพ
  # ถูกประกาศครบ — ประกาศตรง ๆ ไม่พึ่ง transitive dep ของ flutter_test
  yaml: ^3.1.2
  # flutter_native_splash removed — its CLI generates xml/drawables that are
  # already committed; the Flutter plugin runtime registration was failing
  # at compile time because the plugin emits a Java class that pulls extra
  # AndroidX deps. We use the LaunchTheme style + ic_launcher only.

flutter:
  uses-material-design: true

  # NOTE: การประกาศโฟลเดอร์ใน Flutter **ไม่ลงลูก** — `assets/images/` เอาเฉพาะ
  # ไฟล์ที่อยู่ในนั้นตรง ๆ ไม่รวม `assets/images/art/` ทุกโฟลเดอร์ย่อยจึงต้อง
  # ประกาศเองทีละบรรทัด ไม่งั้นภาพจะหายเงียบ ๆ ตอน build (errorBuilder รับไว้
  # จนไม่มี error ให้เห็น — จะรู้ตอนเปิดแอพแล้วเจอช่องว่างเท่านั้น)
  # โฟลเดอร์ `assets/images/` **ไม่ประกาศทั้งก้อน** เพราะจะลาก PNG ต้นฉบับของ
  # ไอคอนแอพ (logo-chantra*.png รวม ~2.5 MB) เข้า APK ไปด้วย ทั้งที่ไฟล์พวกนั้น
  # ใช้ตอน `dart run flutter_launcher_icons` เท่านั้น ไม่เคยถูกวาดบนหน้าจอ
  assets:
    - assets/images/maehmor.webp
    - assets/images/logo-chantra.webp
    - assets/images/art/
    - assets/images/state/
    - assets/images/zodiac/
    - assets/images/ornament/
    - assets/icons/
    - assets/tarot/
    - assets/sounds/

  # Thai display fonts pulled at runtime via google_fonts (Bai Jamjuree,
  # Noto Sans Thai, Noto Serif Thai, Cinzel). No local font bundling needed
  # since the app always has internet (auto-update + AI chat both require it).

# ─── Launcher icons (run: dart run flutter_launcher_icons) ──────────────────
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/logo-chantra.png"
  remove_alpha_ios: true
  min_sdk_android: 26
  adaptive_icon_background: "#1A0F2E"
  # Padded foreground (logo inside inner 66% safe-zone) so launcher masks
  # don't crop the crescent or Thai wordmark. Built by
  # tools/make_adaptive_foreground.py from logo-chantra.png.
  adaptive_icon_foreground: "assets/images/logo-chantra-foreground.png"
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

# Native splash config kept here for future reference. Currently we rely on
# the LaunchTheme defined in android/app/src/main/res/values/styles.xml
# (black background) + the Flutter splash widget for the animated portrait.
# To regenerate native splash assets, re-add `flutter_native_splash` to
# dev_dependencies and run `dart run flutter_native_splash:create`.
