name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.5.0+5000)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Optional: a Google Play service-account key (JSON) with "Release apps
      # to testing tracks" permission in Play Console. When set, the App Bundle
      # is uploaded to the internal testing track as a DRAFT — nothing reaches
      # users until someone rolls it out in Play Console. See docs/GOOGLE_PLAY.md.
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          # ต้องได้ประวัติ + tag ครบ ไม่งั้นขั้นตอน "Build release notes"
          # ด้านล่างมองไม่เห็นแท็กก่อนหน้า แล้วบันทึกรุ่นจะว่างเปล่า
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.7'

      - run: flutter pub get

      - name: Decode signing keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          # Gradle resolves storeFile relative to android/app/ (where the
          # module build.gradle.kts lives), so we must point to ../ to
          # find the keystore at android/upload-keystore.jks.
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=../upload-keystore.jks
          EOF

      # A release must never be signed with the debug key (it changes per
      # machine → installed apps could not be updated, and Play rejects it).
      - name: Require the release keystore
        run: |
          if [ ! -f android/key.properties ]; then
            echo "::error::ANDROID_KEYSTORE_* secrets are missing — refusing to build a debug-signed release"
            exit 1
          fi

      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

      # ── DIRECT channel: one universal APK for GitHub Releases ──────────
      # Per-ABI split APKs were dropped: Flutter gives them versionCode
      # 1000*abi+build (arm64 = 2000+build), which is HIGHER than the
      # universal/Play build — phones that installed a split APK could not
      # take the next update from the in-app updater or from Google Play.
      # (Build 5000 onwards is above every split code ever published.)
      # No --dart-define for the API base: the compiled-in default
      # (ApiClient._kApiBase = จันทรา.online) is what every channel uses.
      - name: Build DIRECT APK (GitHub Releases, in-app updater)
        run: flutter build apk --release --flavor direct

      # ── PLAY channel: App Bundle for Google Play ────────────────────────
      - name: Build PLAY App Bundle (Google Play)
        run: flutter build appbundle --release --flavor play

      - name: Compute version label
        id: ver
        run: |
          V=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:\s*//')
          echo "version=${V%+*}" >> $GITHUB_OUTPUT
          echo "full=$V" >> $GITHUB_OUTPUT

      - name: Stage artifacts with friendly names
        run: |
          set -e
          mkdir -p dist play
          V=${{ steps.ver.outputs.version }}
          cp build/app/outputs/flutter-apk/app-direct-release.apk "dist/juntra-$V-universal.apk"
          cp build/app/outputs/bundle/playRelease/app-play-release.aab "play/juntra-${{ steps.ver.outputs.full }}.aab"
          ls -la dist/ play/

      # The AAB is for Google Play only — kept as a workflow artifact (download
      # it from the run page and upload it in Play Console), never attached to
      # the public GitHub release.
      - name: Keep the App Bundle as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: play-bundle-${{ steps.ver.outputs.full }}
          path: play/*.aab
          retention-days: 90

      - name: Upload to Google Play (internal testing, draft)
        if: ${{ env.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ env.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.xjanova.juntra
          releaseFiles: play/*.aab
          track: internal
          status: draft

      # บันทึกรุ่นที่แอพเอาไปแสดงในหน้าต่างอัปเดต — ห้ามมีลิงก์หรือชื่อของ
      # ที่เก็บไฟล์เด็ดขาด ผู้ใช้ต้องเห็นแค่คำว่า "เซิร์ฟเวอร์อัปเดต"
      #
      # `generate_release_notes: true` ของ GitHub ใส่ลิงก์ตัวเองมาเสมอ:
      #   * <หัวข้อ> by @user in https://github.com/.../pull/10
      #   **Full Changelog**: https://github.com/.../compare/vA...vB
      # ฝั่งแอพมี sanitizeReleaseNotes() กรองให้อีกชั้นแล้ว แต่แอพที่ติดตั้ง
      # ไปแล้วก่อนหน้านี้ใช้ตัวอ่านเดิม จึงต้องไม่ให้ลิงก์เกิดขึ้นตั้งแต่ต้นทาง
      - name: Build release notes (ห้ามมีลิงก์ที่เก็บไฟล์)
        id: notes
        run: |
          CURRENT="${{ github.event.inputs.tag || github.ref_name }}"
          PREV=$(git tag --sort=-creatordate | grep -v "^${CURRENT}$" | head -1)
          {
            echo 'NOTES<<JUNTRA_EOF'
            echo '## สิ่งที่เปลี่ยนในรุ่นนี้'
            if [ -n "$PREV" ]; then
              # เอาเฉพาะหัวข้อคอมมิต ตัด URL/@mention ทุกชนิดทิ้ง
              git log --no-merges --pretty=format:'* %s' "$PREV"..HEAD                 | sed -E 's#https?://[^[:space:]]+##g; s/[[:space:]]+by[[:space:]]+@[A-Za-z0-9_-]+//g'                 | grep -v -i 'github'                 | grep -v -E '^\* (chore|ci|build|test|refactor|style)(\(|:)'                 | grep -v -F '[skip ci]'                 | head -20
            else
              echo '* ปรับปรุงประสบการณ์โดยรวมและแก้บั๊กเล็กน้อย'
            fi
            echo 'JUNTRA_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release (direct APK)
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          # ห้ามเปิด generate_release_notes — ดูเหตุผลในขั้นตอนด้านบน
          generate_release_notes: false
          body: ${{ steps.notes.outputs.NOTES }}
          name: "จันทราพยากรณ์ ${{ steps.ver.outputs.version }}"
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
