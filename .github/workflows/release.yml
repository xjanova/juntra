name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0+1)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.7'

      - run: flutter pub get

      - name: Decode signing keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          # Gradle resolves storeFile relative to android/app/ (where the
          # module build.gradle.kts lives), so we must point to ../ to
          # find the keystore at android/upload-keystore.jks. Local devs
          # who keep the .jks at android/ + run from the project root see
          # the same resolution path.
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=../upload-keystore.jks
          EOF

      # We tolerate info + warnings in CI — they're style hints, not bugs,
      # and fixing them all would balloon this commit. Errors still fail.
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test || echo "no tests yet"

      # We split the build into TWO gradle invocations with `flutter clean`
      # between them. AGP can't share its shrinkResources output between
      # split-per-abi APKs and a universal APK in one run — conflict
      # produces "Multiple shrunk-resources files found" failures
      # (https://issuetracker.google.com/402800800).
      #
      # AAB (Play Store bundle) hits the same issue against any APK build,
      # so we defer it until the app graduates to Play Store; for now,
      # GitHub Releases delivers APKs and the in-app UpdateService picks
      # the universal asset.
      # No --dart-define for the API base: the app connects to จันทรา.online
      # ONLY, which is the compiled-in default (ApiClient._kApiBase). Letting
      # the default apply keeps release identical to debug and avoids piping a
      # non-ASCII (Thai IDN) host through the CI shell. (Earlier releases wrongly
      # pointed at main.thaiprompt.online — the Thaiprompt pool, not juntraweb.)
      - name: Build split-per-ABI APKs (arm64, armv7, x86_64)
        run: flutter build apk --release --split-per-abi

      - name: Clean intermediates so universal build won't collide
        run: flutter clean && flutter pub get

      - name: Build universal APK
        run: flutter build apk --release

      - name: Compute version label
        id: ver
        run: |
          V=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:\s*//' | sed 's/+/+/')
          NAME=${V%+*}
          echo "version=$NAME" >> $GITHUB_OUTPUT

      - name: Stage artifacts with friendly names
        run: |
          mkdir -p dist
          V=${{ steps.ver.outputs.version }}
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk     "dist/juntra-$V-arm64-v8a.apk"     || true
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk   "dist/juntra-$V-armeabi-v7a.apk"   || true
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk        "dist/juntra-$V-x86_64.apk"        || true
          cp build/app/outputs/flutter-apk/app-release.apk               "dist/juntra-$V-universal.apk"     || true
          ls -la dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          name: "จันทราพยากรณ์ ${{ steps.ver.outputs.version }}"
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
